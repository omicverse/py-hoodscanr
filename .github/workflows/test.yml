name: tests

# This repository shipped without any CI. Its suite passed on the machine it was
# written on, which says nothing about whether it runs anywhere else -- the
# sibling port py-spatialecotyper looked equally healthy locally and could not
# even collect its tests on a clean runner, because an absolute path from the
# development host had been baked into a module.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Exports resolve
        run: |
          python -c "
          import pyhoodscanr as P
          missing = [n for n in getattr(P, '__all__', []) if not hasattr(P, n)]
          assert not missing, missing
          print(P.__version__, len(getattr(P, '__all__', [])), 'exports OK')
          "
      - name: Run the R-free test suite
        # The R-parity tests auto-skip without a reference dump; regenerate one
        # locally with tests/r_reference_driver.R to run the full gate.
        run: pytest -q
